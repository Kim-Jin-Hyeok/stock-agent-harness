spring:
  application:
    name: stock-agent-harness

server:
  port: 8080

logging:
  level:
    root: INFO
    com.stock: DEBUG

market:
  current-price:
    cache:
      ttl: 30s

harness:
  max-steps: 10
  max-tool-calls: 5
  max-tool-retries: 1
  scheduler:
    enabled: false
    fixed-delay-ms: 600000

risk:
  max-order-ratio: 0.1
  max-position-ratio: 0.3
