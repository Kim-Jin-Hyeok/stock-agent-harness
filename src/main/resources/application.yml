spring:
  application:
    name: stock-agent-harness

server:
  port: 8080

logging:
  level:
    root: INFO
    com.stock: DEBUG

market:
  current-price:
    cache:
      ttl: 30s
    validation:
      max-age: 1m

harness:
  max-steps: 10
  max-tool-calls: 5
  max-tool-retries: 1
  max-provider-calls: 5
  retry:
    delay: 500ms
  scheduler:
    enabled: false
    fixed-delay-ms: 300000
    zone-id: Asia/Seoul
    strategies:
      - enabled: true
        strategy-id: DAY_TRADING_V1
        strategy-version: 1
        horizon: DAY_TRADING
      - enabled: true
        strategy-id: SWING_V1
        strategy-version: 1
        horizon: SWING
      - enabled: true
        strategy-id: LONG_TERM_V1
        strategy-version: 1
        horizon: LONG_TERM

risk:
  max-order-ratio: 0.1
  max-position-ratio: 0.3
