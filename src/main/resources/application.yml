spring:
  application:
    name: stock-agent-harness

server:
  port: 8080

logging:
  level:
    root: INFO
    com.stock: DEBUG

broker:
  order:
    validity: 5m
    reconciliation:
      scheduler:
        enabled: false
        fixed-delay-ms: 10000
  kis:
    enabled: false
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}
    account-number: ${KIS_ACCOUNT_NUMBER:}
    account-product-code: ${KIS_ACCOUNT_PRODUCT_CODE:}
    token-refresh-before-expiration: 1m
    account-balance-max-pages: 10
    order-inquiry-max-pages: 10
    cancelable-order-inquiry-max-pages: 10

market:
  calendar:
    closed-dates: []
  current-price:
    cache:
      ttl: 30s
    validation:
      max-age: 1m

portfolio:
  initialization:
    allocations:
      - strategy-id: DAY_TRADING_V1
        strategy-version: 1
        horizon: DAY_TRADING
        weight: 1
      - strategy-id: SWING_V1
        strategy-version: 1
        horizon: SWING
        weight: 1
      - strategy-id: LONG_TERM_V1
        strategy-version: 1
        horizon: LONG_TERM
        weight: 1

trade:
  execution:
    mode: ${TRADE_EXECUTION_MODE:VIRTUAL}

harness:
  max-steps: 10
  max-tool-calls: 5
  max-tool-retries: 1
  max-provider-calls: 5
  retry:
    delay: 500ms
  scheduler:
    enabled: false
    fixed-delay-ms: 300000
    zone-id: Asia/Seoul
    strategies:
      - enabled: true
        strategy-id: DAY_TRADING_V1
        strategy-version: 1
        horizon: DAY_TRADING
        window:
          allowed-days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          starts-at: "09:00"
          ends-at: "15:30"
      - enabled: true
        strategy-id: SWING_V1
        strategy-version: 1
        horizon: SWING
        window:
          allowed-days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          starts-at: "15:00"
          ends-at: "15:30"
      - enabled: true
        strategy-id: LONG_TERM_V1
        strategy-version: 1
        horizon: LONG_TERM
        window:
          allowed-days: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
          starts-at: "15:00"
          ends-at: "15:30"

risk:
  max-order-ratio: 0.1
  max-position-ratio: 0.3
