spring:
  config:
    activate:
      on-profile: paper-observation

broker:
  order:
    reconciliation:
      scheduler:
        enabled: false
    cancellation:
      scheduler:
        enabled: false
  kis:
    enabled: true
    base-url: https://openapivts.koreainvestment.com:29443
    app-key: ${KIS_PAPER_APP_KEY:}
    app-secret: ${KIS_PAPER_APP_SECRET:}
    account-number: ${KIS_PAPER_ACCOUNT_NUMBER:}
    account-product-code: ${KIS_PAPER_ACCOUNT_PRODUCT_CODE:}

trade:
  execution:
    mode: VIRTUAL

harness:
  scheduler:
    enabled: true
