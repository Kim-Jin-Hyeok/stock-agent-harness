services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local,paper-observation
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-stock_agent_harness}
      DB_USERNAME: ${DB_USERNAME:-stock}
      DB_PASSWORD: ${DB_PASSWORD:-stock-local-password}
      KIS_PAPER_APP_KEY: "${KIS_PAPER_APP_KEY:-}"
      KIS_PAPER_APP_SECRET: "${KIS_PAPER_APP_SECRET:-}"
      KIS_PAPER_ACCOUNT_NUMBER: "${KIS_PAPER_ACCOUNT_NUMBER:-}"
      KIS_PAPER_ACCOUNT_PRODUCT_CODE: "${KIS_PAPER_ACCOUNT_PRODUCT_CODE:-01}"
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_NAME:-stock_agent_harness}
      MYSQL_USER: ${DB_USERNAME:-stock}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local-password}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - stock-agent-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  stock-agent-mysql-data:
