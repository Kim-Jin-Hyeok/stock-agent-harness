services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_NAME:-stock_agent_harness}
      MYSQL_USER: ${DB_USERNAME:-stock}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock-local-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local-password}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - stock-agent-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  stock-agent-mysql-data:
